# Copy these bindings into wrangler.toml after `wrangler d1 create` and
# `wrangler r2 bucket create`. Keep the R2 bucket private.

[[d1_databases]]
binding = "DB"
database_name = "storyflow-skills-market"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "storyflow-skills-market-packages"
