name = "storyflow-skills-market"
main = "src/index.ts"
compatibility_date = "2026-07-17"
workers_dev = false
routes = [
  { pattern = "storyflow-skills.zjding.com", custom_domain = true },
]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "storyflow-skills-market"
database_id = "2d1b2d8f-b807-42bb-ae33-003185507e6a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "storyflow-skills-market-packages"

[vars]
STORYFLOW_SKILLS_MARKET_JWT_CURRENT_KEY_ID = "skills-market-2026-08"
STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_KEY_ID = ""
