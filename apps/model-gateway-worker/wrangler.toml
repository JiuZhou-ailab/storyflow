name = "storyflow-newapi"
main = "src/index.ts"
compatibility_date = "2026-05-28"
workers_dev = false

# Pinned on purpose. Smart Placement re-picks the execution location on every
# deploy; on 2026-11-11 it picked LAX, where 20-28% of requests to the upstream
# origin never returned headers (520/524). Singapore is kept for latency, close to
# the users and the origin; that day it stalled on ~0.5% of requests while LHR/AMS/CDG
# had none. If stalls grow, move the region instead of returning to Smart Placement,
# after comparing the upstream_ray colo suffix against upstream_status in Observability.
[placement]
region = "aws:ap-southeast-1"

routes = [
  { pattern = "storyflow-model.zjding.com", custom_domain = true },
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

[[services]]
binding = "ACCESS_AUTHORITY"
service = "storyflow-auth-broker"
entrypoint = "AccessAuthority"

[vars]
# Migration only; remove legacy acceptance at the managed-access cutover.
STORYFLOW_ACCESS_ENFORCEMENT = "legacy"
STORYFLOW_GATEWAY_JWT_CURRENT_KEY_ID = "model-access-2026-07"
STORYFLOW_GATEWAY_JWT_AUDIENCE = "storyflow-model-gateway"
STORYFLOW_GATEWAY_JWT_ISSUER = "storyflow-auth-broker"
NEWAPI_UPSTREAM_BASE_URL = "https://jzapi.duanju.com"
CATALOG_ORIGIN_URL = "https://storyflow-catalog-origin.zjding.com"
