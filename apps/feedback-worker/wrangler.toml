name = "storyflow-feedback"
main = "src/index.ts"
compatibility_date = "2026-05-28"
workers_dev = true
routes = [
  { pattern = "storyflow-feedback.zjding.com", custom_domain = true },
]

[vars]
GITHUB_REPOSITORY = "JiuZhou-ailab/storyflow"
FEEDBACK_GITHUB_LABELS = "feedback,ai-triage"

[[r2_buckets]]
binding = "FEEDBACK_ASSETS"
bucket_name = "storyflow-feedback-assets"

# Account-local namespace reserved for Storyflow feedback (tool gateway uses 19001/19002).
[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "19003"

[ratelimits.simple]
limit = 5
period = 60
