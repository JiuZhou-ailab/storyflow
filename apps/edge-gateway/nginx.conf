# input: HTTP requests on port 8000 and Docker DNS on storyflow-edge
# output: Health response and path-preserving reverse proxies to private services
# pos: Minimal edge routing; it does not own service authentication

events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;

  server {
    listen 8000;
    client_max_body_size 64k;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location /hot-drama/ {
      proxy_pass http://hot-drama-mcp:8789/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 60s;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}
