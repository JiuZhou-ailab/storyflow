# input: Deployment-only database, origin, and Cloudflare Tunnel secrets
# output: VPC-local Catalog API exposed through an outbound QUIC tunnel
# pos: Database-adjacent origin deployment for Storyflow catalog access

services:
  catalog-api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8788/ready', headers={'X-Storyflow-Origin-Token': os.environ['ORIGIN_TOKEN']});
          urllib.request.urlopen(request, timeout=5)
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    depends_on:
      catalog-api:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol quic run --token ${CLOUDFLARE_TUNNEL_TOKEN}
