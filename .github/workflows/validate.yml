name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/novel-writing-workspace
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify shared Host startup contracts
        shell: bash
        run: |
          bun test ./packages/server-core/src/bootstrap/server-lock.isolated.ts
          bun test ./packages/server-core/src/bootstrap/startup-recovery.isolated.ts

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Electron binary for main-process tests
        run: node node_modules/electron/install.js

      - name: Run validation suite
        run: bun run validate:ci
