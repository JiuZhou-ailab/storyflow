# input: Skills Market source or dependency changes plus manually authorized production credentials
# output: Automatic contract validation and manual Market deployment with authenticated and full bundle canaries
# pos: Independent Skills Market CI/CD boundary; desktop releases never call this workflow
name: Skills Market

on:
  pull_request:
    paths:
      - "apps/skills-market/**"
      - "packages/shared/src/resources/**"
      - "packages/shared/src/skills/**"
      - "packages/shared/package.json"
      - "packages/session-tools-core/src/skill-validation.ts"
      - "packages/session-tools-core/package.json"
      - "packages/pi-agent-server/src/**"
      - "scripts/verify-skills-market.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-skills-market.yml"
  push:
    branches:
      - main
    paths:
      - "apps/skills-market/**"
      - "packages/shared/src/resources/**"
      - "packages/shared/src/skills/**"
      - "packages/shared/package.json"
      - "packages/session-tools-core/src/skill-validation.ts"
      - "packages/session-tools-core/package.json"
      - "packages/pi-agent-server/src/**"
      - "scripts/verify-skills-market.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-skills-market.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Verify deployment ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify deployment configuration
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET }}
          STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET: ${{ secrets.STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          previous_key_id="$(bun --eval '
            import config from "./apps/skills-market/wrangler.toml" with { type: "toml" };
            console.log(config.vars.STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_KEY_ID ?? "");
          ')"
          if { test -n "$previous_key_id" && test -z "$STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET"; } \
            || { test -z "$previous_key_id" && test -n "$STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET"; }; then
            echo "Skills Market previous key id and secret must be configured together"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Skills Market
        run: bun run skills-market:test

      - name: Migrate and deploy Skills Market
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET }}
          STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET: ${{ secrets.STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET }}
        run: |
          set -euo pipefail
          bunx wrangler@4.114.0 d1 migrations apply storyflow-skills-market --remote \
            --config apps/skills-market/wrangler.toml
          printf '%s' "$STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET" \
            | bunx wrangler@4.114.0 secret put STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET \
                --config apps/skills-market/wrangler.toml >/dev/null
          if [ -n "$STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET" ]; then
            printf '%s' "$STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET" \
              | bunx wrangler@4.114.0 secret put STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET \
                  --config apps/skills-market/wrangler.toml >/dev/null
          elif bunx wrangler@4.114.0 secret list --format json \
            --config apps/skills-market/wrangler.toml \
            | bun --eval '
                const secrets = await Bun.stdin.json();
                process.exit(secrets.some(({ name }) => name === "STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET") ? 0 : 1);
              '; then
            CI=1 bunx wrangler@4.114.0 secret delete STORYFLOW_SKILLS_MARKET_JWT_PREVIOUS_SECRET \
              --config apps/skills-market/wrangler.toml >/dev/null
          fi
          bunx wrangler@4.114.0 deploy --config apps/skills-market/wrangler.toml

      - name: Verify Skills Market
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://storyflow-skills.zjding.com/health > "$RUNNER_TEMP/market-health.json"
          MARKET_HEALTH_PATH="$RUNNER_TEMP/market-health.json" bun --eval '
            const body = await Bun.file(process.env.MARKET_HEALTH_PATH).json();
            if (body.status !== "ok" || !(body.catalog > 0)) process.exit(1);
          '
          bun run skills-market:verify
