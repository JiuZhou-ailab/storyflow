# input: Website and versioned release-note changes, Cloudflare Pages and R2 credentials
# output: Tested production landing build deployed to Cloudflare Pages
# pos: Canonical deployment boundary for apps/marketing

name: Deploy Marketing

on:
  push:
    branches:
      - main
    paths:
      - "apps/marketing/**"
      - "apps/electron/resources/release-notes/*.md"
      - "scripts/build-marketing.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-marketing.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test marketing downloads
        run: bun test apps/marketing/src/__tests__/downloads.test.ts

      - name: Build marketing site
        run: bun run marketing:build

      - name: Publish tutorial playback video to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORYFLOW_R2_BUCKET: ${{ secrets.STORYFLOW_R2_BUCKET }}
        run: |
          test -n "$STORYFLOW_R2_BUCKET"
          bunx wrangler@4.114.0 r2 object put "$STORYFLOW_R2_BUCKET/tutorials/storyflow-getting-started-v2.mp4" \
            --file apps/marketing/reference-assets/tutorial/storyflow-getting-started-v2.mp4 \
            --content-type video/mp4 --cache-control "public, max-age=31536000, immutable" --remote --force
          range_status=$(curl --fail --silent --show-error --range 0-1023 \
            --output /tmp/tutorial-range.bin --write-out '%{http_code}' \
            https://story-storage.zjding.com/tutorials/storyflow-getting-started-v2.mp4)
          test "$range_status" = 206
          test "$(wc -c < /tmp/tutorial-range.bin)" -eq 1024

      - name: Deploy marketing site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORYFLOW_PAGES_PROJECT_NAME: ${{ vars.STORYFLOW_PAGES_PROJECT_NAME || 'storyflow' }}
        run: |
          bunx wrangler pages deploy apps/marketing/dist \
            --project-name "$STORYFLOW_PAGES_PROJECT_NAME" \
            --branch main
