name: Deploy Feedback Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-feedback-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Verify Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("Missing $name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            printf '%s\n' "${missing[@]}"
            exit 1
          fi

      - name: Verify feedback Worker runtime secrets
        working-directory: apps/feedback-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
        run: |
          set -euo pipefail

          secrets_json="$(bunx wrangler secret list --format=json)"
          if ! printf '%s\n' "$secrets_json" | grep -q '"name"[[:space:]]*:[[:space:]]*"FEEDBACK_GITHUB_TOKEN"'; then
            echo "Missing FEEDBACK_GITHUB_TOKEN Worker secret. Run: cd apps/feedback-worker && bunx wrangler secret put FEEDBACK_GITHUB_TOKEN"
            exit 1
          fi

      - name: Deploy feedback Worker
        working-directory: apps/feedback-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
        run: bunx wrangler deploy
